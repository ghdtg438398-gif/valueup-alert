name: 밸류업 공시 알림

on:
  schedule:
    # 영업일 09:00 / 15:35 KST (= 00:00 / 06:35 UTC). 공휴일은 프로그램이 알아서 건너뜀
    # GitHub 예약 실행은 몇 분~수십 분 늦게 시작될 수 있음 (3시간 안이면 해당 회차로 발송)
    - cron: "0 0 * * 1-5"
    - cron: "35 6 * * 1-5"
  workflow_dispatch:
    inputs:
      slot:
        description: "강제 발송 회차 (비우면 수집·대시보드만 갱신). 예: 09:00 또는 15:30"
        required: false
        default: ""
      backfill:
        description: "과거 공시 불러오기 (일 수, 예: 365). 알림 없이 적재만. 비우면 안 함"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: valueup
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TZ: Asia/Seoul
      DART_API_KEY: ${{ secrets.DART_API_KEY }}
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
      COVERAGE_FILE: coverage/2026_coverage.xlsx
      DOWNLOAD_FILES: "false"
      DIGEST_TIMES: "09:00,15:30"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 수집·판별·알림·대시보드 생성
        run: >-
          python run.py --action
          ${{ github.event.inputs.slot && format('--slot {0}', github.event.inputs.slot) || '' }}
          ${{ github.event.inputs.backfill && format('--backfill {0}', github.event.inputs.backfill) || '' }}
      - name: 상태(DB) 저장
        run: |
          git config user.name "valueup-bot"
          git config user.email "valueup-bot@users.noreply.github.com"
          git add -f data/valueup.db data/pub_status.json docs 2>/dev/null || git add -f data/valueup.db docs
          git commit -m "update $(date '+%Y-%m-%d %H:%M')" || echo "변경 없음"
          # 실행 중 사이트에서 발간 체크가 저장됐으면 그 값을 우선
          git pull --rebase -X ours origin ${{ github.ref_name }}
          git push
