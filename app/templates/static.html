<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>밸류업 공시 트래커</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f6f5f2;--panel:#fff;--ink:#1b1d21;--muted:#6b6f78;--line:#e4e2dc;--accent:#c8102e;--accent-soft:#fbe9ec;--ok:#1f7a4d;--ok-soft:#e5f3ec;--info:#1f4f8a;--info-soft:#e6eef9;--pu:#6b3fb5;--pu-soft:#efe6fb}
@media (prefers-color-scheme:dark){:root{--bg:#121316;--panel:#1b1d21;--ink:#ecebe7;--muted:#9a9ca3;--line:#2c2e33;--accent:#ff5a6e;--accent-soft:#3a1d22;--ok:#5fc791;--ok-soft:#173326;--info:#7fb0ef;--info-soft:#18273b;--pu:#b896f0;--pu-soft:#2a2140}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Pretendard,-apple-system,"Malgun Gothic",sans-serif}
header{background:var(--panel);border-bottom:1px solid var(--line)}
.wrap{max-width:1400px;margin:0 auto;padding:0 20px}
.bar{display:flex;align-items:center;height:56px;gap:20px}
.brand{font-weight:800;display:flex;gap:8px;align-items:center}.brand i{width:10px;height:10px;border-radius:2px;background:var(--accent);display:inline-block}
.upd{margin-left:auto;color:var(--muted);font-size:13px}
main{padding:24px 0 60px}
.banner{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap;margin-bottom:18px}
.kpi{flex:0 0 300px;background:linear-gradient(0deg,var(--accent-soft),var(--panel) 70%);border:1px solid var(--accent);border-radius:12px;padding:14px 16px}
.kpi small{color:var(--muted);font-weight:600;font-size:12px}.kpi b{display:block;font-size:26px;margin-top:2px}.kpi span{font-size:12px;color:var(--muted)}
.ctrl{display:flex;gap:10px;align-items:center;margin-left:auto;flex-wrap:wrap}
.tog{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600;cursor:pointer;color:inherit;font-family:inherit}
.sw{width:34px;height:20px;border-radius:99px;background:#c9ccd3;position:relative}.sw:after{content:"";position:absolute;left:3px;top:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:.15s}
.sw.on{background:var(--ok)}.sw.on:after{left:17px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;padding:6px 11px;font:600 12.5px Pretendard,sans-serif;color:var(--muted);cursor:pointer}.seg button.on{background:var(--info-soft);color:var(--info)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:14px 16px;border-bottom:1px solid var(--line);align-items:center}
.chip{border:1px solid var(--line);border-radius:99px;padding:5px 11px;font:600 13px Pretendard,sans-serif;background:var(--panel);color:var(--ink);cursor:pointer}
.chip em{font-style:normal;color:var(--muted);margin-left:4px;font-weight:500}.chip.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}.chip.on em{color:inherit;opacity:.7}
.right{margin-left:auto;display:flex;gap:8px}
.btn{font:600 13px Pretendard,sans-serif;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;padding:6px 12px;cursor:pointer}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}
th{font-size:12px;color:var(--muted);font-weight:600;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.co{white-space:nowrap}.co a{color:inherit;text-decoration:none;font-weight:700}.co small,.cap small{display:block;color:var(--muted);font-size:11.5px}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.t-계획,.t-재공시{background:var(--info-soft);color:var(--info)}.t-이행{background:var(--ok-soft);color:var(--ok)}.t-이행\+계획{background:var(--pu-soft);color:var(--pu)}
.pub-no{background:var(--accent-soft);color:var(--accent)}.pub-yes{background:var(--ok-soft);color:var(--ok)}
.key{font-size:12.5px;max-width:330px}.muted{color:var(--muted)}
tr.out td{color:var(--muted)}tr.out .pill{opacity:.5}
.day td{background:var(--bg);font-size:12px;font-weight:700;color:var(--muted);padding:7px 12px}
.note{padding:10px 16px;font-size:12px;color:var(--muted)}
.ck{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;margin-right:10px;cursor:pointer;white-space:nowrap}
.ck input{width:16px;height:16px;accent-color:var(--ok);margin:0;cursor:pointer}.ck.dim{opacity:.45}
.ck input:disabled{cursor:not-allowed}
.warn{margin:0 0 14px;padding:10px 14px;border-radius:8px;background:var(--accent-soft);color:var(--accent);font-size:13px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:9px 16px;border-radius:8px;font-size:13px;opacity:0;transition:.2s;pointer-events:none}
.toast.on{opacity:1}
@media (max-width:760px){.hide-m{display:none}.kpi{flex-basis:100%}.ctrl{margin-left:0}}
</style></head>
<body>
<header><div class="wrap bar"><div class="brand"><i></i>밸류업 공시 트래커</div><div class="upd" id="upd"></div><button class="btn" id="auth" style="font-size:12px"></button></div></header>
<main><div class="wrap">
  <div class="warn" id="caperr" hidden></div>
  <div class="banner">
    <div class="kpi" id="kpi"></div>
    <div class="ctrl">
      <button class="tog" id="tog"><span class="sw on" id="sw"></span>작성 대상만 <span class="muted" style="font-weight:500" id="range"></span></button>
      <div class="seg" id="periods"></div>
    </div>
  </div>
  <div class="card">
    <div class="chips"><span id="chips" style="display:contents"></span>
      <div class="right"><div class="seg" id="types"></div><button class="btn" id="xls">⬇ 엑셀</button></div></div>
    <div class="tw"><table>
      <thead><tr><th>시각</th><th>종목</th><th>공시 구분</th><th class="num">발표일 시총</th><th class="num hide-m">종가</th><th class="hide-m">핵심</th><th>담당</th><th>발간 체크</th><th>상태</th></tr></thead>
      <tbody id="tb"></tbody></table></div>
    <div class="note">발간 체크는 바로 저장되어 팀 전체에 공유됩니다 (처음 한 번 오른쪽 위 <b>체크 권한 연결</b> 필요) · 발표일 시총 = 공시일 종가 × 상장주식수 · PDF·한글·워드 첨부 확인된 공시만</div>
  </div>
</div></main><div class="toast" id="toast"></div>
<script>
let D = {{ data_json|safe }};
const S = {period: 'today', analyst: '', type: '', target: true};
const P = {today: '오늘', week: '이번 주', month: '최근 30일', year: '1년'};
const W = '일월화수목금토';
const ymd = d => d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0');
const td = new Date(+D.today.slice(0,4), +D.today.slice(4,6) - 1, +D.today.slice(6));
function since(p) { const d = new Date(td); if (p === 'week') d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
  if (p === 'month') d.setDate(d.getDate() - 30); if (p === 'year') d.setDate(d.getDate() - 365); return ymd(d); }
// ---- 발간 체크: GitHub 저장소의 data/pub_status.json 을 직접 수정 ----
const LS = k => { try { return localStorage.getItem(k) } catch (e) { return null } };
const LSset = (k, v) => { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k) } catch (e) {} };
let T = LS('vu_token'); let REPO = LS('vu_repo') || D.repo; let WHO = LS('vu_who') || '';
const FILE = 'data/pub_status.json';
const gh = (path, opt = {}) => fetch(`https://api.github.com/repos/${REPO}/contents/${path}`, {...opt,
  headers: {'Authorization': 'Bearer ' + T, 'Accept': 'application/vnd.github+json', ...(opt.headers || {})}});
const b64d = b => new TextDecoder().decode(Uint8Array.from(atob(b.replace(/\n/g, '')), c => c.charCodeAt(0)));
const b64e = s => btoa(String.fromCharCode(...new TextEncoder().encode(s)));
function toast(m) { const t = document.getElementById('toast'); t.textContent = m; t.classList.add('on'); setTimeout(() => t.classList.remove('on'), 2200); }
function statusOf(p, i) { return p && i ? '계획·이행 발간' : p ? '계획 발간완료' : i ? '이행 발간완료' : '미발간'; }
async function readPub() { const r = await gh(FILE + '?ref=' + D.branch + '&t=' + Date.now());
  if (r.status === 404) return {data: {}, sha: null}; if (!r.ok) throw new Error(r.status);
  const j = await r.json(); return {data: JSON.parse(b64d(j.content) || '{}'), sha: j.sha}; }
function applyPub(data) { for (const r of D.rows) { const v = data[r.id]; if (v) { r.pubPlan = !!v.plan; r.pubImpl = !!v.impl; r.pub = statusOf(r.pubPlan, r.pubImpl); } } }
async function savePub(id, field, val) {
  for (let k = 0; k < 3; k++) {
    const {data, sha} = await readPub();
    const cur = data[id] || {plan: false, impl: false};
    cur[field] = val; cur.by = WHO; cur.at = new Date().toLocaleString('sv-SE').slice(0, 19);
    data[id] = cur;
    const r = await gh(FILE, {method: 'PUT', body: JSON.stringify({message: `발간 체크: ${id} ${field}=${val} (${WHO || '-'})`,
      content: b64e(JSON.stringify(data, null, 1)), branch: D.branch, ...(sha ? {sha} : {})})});
    if (r.ok) { applyPub(data); return true; }
    if (r.status !== 409 && r.status !== 422) throw new Error(r.status);
  }
  throw new Error('충돌');
}
async function connect() {
  if (T) { if (confirm('체크 권한 연결을 해제할까요?')) { LSset('vu_token'); T = null; render(); } return; }
  const t = prompt('GitHub 토큰을 붙여넣으세요 (Fine-grained token, 이 저장소 Contents: Read and write)'); if (!t) return;
  const repo = D.repo || prompt('저장소 이름 (예: 아이디/valueup-alert)'); if (!repo) return;
  const who = prompt('이름 (체크 기록용)', WHO) || '';
  T = t.trim(); REPO = repo.trim(); WHO = who.trim();
  try { await readPub(); } catch (e) { alert('연결 실패 (' + e.message + '). 토큰 권한과 저장소 이름을 확인하세요.'); T = null; return; }
  LSset('vu_token', T); LSset('vu_repo', REPO); LSset('vu_who', WHO); toast('연결됐어요. 이제 체크할 수 있어요'); await refreshPub();
}
async function refreshData() {  // 내려받은 파일이 오래돼도 저장소의 최신 데이터로 갱신
  const r = await gh('docs/data.json?ref=' + D.branch + '&t=' + Date.now(), {headers: {'Accept': 'application/vnd.github.raw+json'}});
  if (r.ok) { const nd = await r.json(); if ((nd.lastUpdate || '') >= (D.lastUpdate || '')) D = nd; } }
async function refreshPub() { if (!T) return; try { await refreshData(); applyPub((await readPub()).data); render(); } catch (e) { toast('최신 발간 상태를 못 불러왔어요 (' + e.message + ')'); } }
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function base() { const s = since(S.period);
  return D.rows.filter(r => r.dt >= s && (!S.target || r.target !== false)
    && (!S.type || (S.type === '이행' ? r.type.startsWith('이행') : r.type !== '이행'))); }
function view() { const b = base();
  return S.analyst === '__none__' ? b.filter(r => !r.analysts.length) : S.analyst ? b.filter(r => r.analysts.includes(S.analyst)) : b; }
function render() {
  document.getElementById('auth').textContent = T ? '✓ 체크 권한 연결됨' + (WHO ? ' · ' + WHO : '') : '🔑 체크 권한 연결';
  const ce = document.getElementById('caperr'); ce.hidden = !D.capError; ce.textContent = '⚠ ' + D.capError;
  document.getElementById('upd').textContent = D.lastUpdate ? '마지막 업데이트 ' + D.lastUpdate.slice(5, 16).replace('-', '/') : '';
  const t = D.rows.filter(r => r.dt === D.today);
  document.getElementById('kpi').innerHTML = `<small>오늘 신규 공시 · ${D.today.slice(4,6)}/${D.today.slice(6)}(${W[td.getDay()]})</small><b>${t.length}건</b>
    <span>계획 ${t.filter(r => !r.type.startsWith('이행')).length} · 이행 ${t.filter(r => r.type.startsWith('이행')).length} · 작성 대상 ${t.filter(r => r.target !== false).length}건</span>`;
  document.getElementById('range').textContent = `발표일 시총 ${D.capMin.toLocaleString()}억~${D.capMax.toLocaleString()}억`;
  document.getElementById('sw').className = 'sw' + (S.target ? ' on' : '');
  document.getElementById('periods').innerHTML = Object.entries(P).map(([k, v]) => `<button class="${S.period === k ? 'on' : ''}" data-p="${k}">${v}</button>`).join('');
  document.getElementById('types').innerHTML = [['', '계획·이행'], ['계획', '계획'], ['이행', '이행']].map(([k, v]) => `<button class="${S.type === k ? 'on' : ''}" data-t="${k}">${v}</button>`).join('');
  const b = base();
  const chip = (k, label, n) => `<button class="chip ${S.analyst === k ? 'on' : ''}" data-a="${esc(k)}">${esc(label)}<em>${n}</em></button>`;
  document.getElementById('chips').innerHTML = chip('', '전체', b.length) + D.analysts.map(a => chip(a, a, b.filter(r => r.analysts.includes(a)).length)).join('')
    + chip('__none__', '커버리지 외', b.filter(r => !r.analysts.length).length);
  const rows = view(); let day = ''; let h = '';
  for (const r of rows) {
    if (S.period !== 'today' && r.dt !== day) { day = r.dt; h += `<tr class="day"><td colspan="9">${+r.dt.slice(4,6)}월 ${+r.dt.slice(6)}일</td></tr>`; }
    const out = r.target === false;
    h += `<tr class="${out ? 'out' : ''}"><td class="muted">${r.time}</td>
      <td class="co"><a href="${esc(r.url)}" target="_blank">${esc(r.name)}</a><small>${esc(r.code)} · ${esc(r.market)}</small></td>
      <td><span class="pill t-${esc(r.type)}">${esc(r.type)}</span>${r.unverified ? ' <span class="muted" title="KIND 접속 불가로 첨부 미확인">⚠</span>' : ''}</td>
      <td class="num cap">${r.cap ? `<b>${r.capTxt}</b><small>${out ? '대상 외' : r.capDt + ' 종가' + (r.final ? '' : ' · 잠정')}</small>` : '<span class="muted">확인 중</span>'}</td>
      <td class="num hide-m">${r.close ? r.close.toLocaleString() : '-'}</td>
      <td class="key hide-m">${esc(r.key)}</td>
      <td style="font-size:12.5px">${r.analysts.length ? esc(r.analysts.join(', ')) : '—'}</td>
      <td>${out ? '<span class="muted" style="font-size:12px">작성 대상 아님</span>' :
        `<label class="ck ${r.type === '이행' ? 'dim' : ''}"><input type="checkbox" data-id="${r.id}" data-f="plan" ${r.pubPlan ? 'checked' : ''} ${T ? '' : 'disabled title="체크 권한 연결 필요"'}>계획 발간</label>`
      + `<label class="ck ${['계획','재공시'].includes(r.type) ? 'dim' : ''}"><input type="checkbox" data-id="${r.id}" data-f="impl" ${r.pubImpl ? 'checked' : ''} ${T ? '' : 'disabled title="체크 권한 연결 필요"'}>이행 발간</label>`}</td>
      <td>${out ? '' : `<span class="pill ${r.pub === '미발간' ? 'pub-no' : 'pub-yes'}">${r.pub}</span>`}</td></tr>`;
  }
  document.getElementById('tb').innerHTML = h || `<tr><td colspan="9" class="muted" style="text-align:center;padding:40px">${P[S.period]} 조건에 맞는 공시가 없습니다.</td></tr>`;
}
document.addEventListener('change', async e => { const cb = e.target; if (!cb.dataset || !cb.dataset.f) return;
  cb.disabled = true;
  try { await savePub(cb.dataset.id, cb.dataset.f, cb.checked); toast('저장됐어요'); render(); }
  catch (err) { cb.checked = !cb.checked; cb.disabled = false; alert('저장 실패: ' + err.message); } });
document.addEventListener('click', e => { const el = e.target.closest('button'); if (!el) return;
  if (el.id === 'auth') { connect(); return; }
  if (el.id === 'tog') S.target = !S.target; else if (el.dataset.p) S.period = el.dataset.p;
  else if (el.dataset.t !== undefined) S.type = el.dataset.t; else if (el.dataset.a !== undefined) S.analyst = el.dataset.a;
  else if (el.id === 'xls') { const ws = XLSX.utils.json_to_sheet(view().map(r => ({'종목명': r.name,
      '발표일 시총(억원)': r.cap ? Math.round(r.cap / 1e8) : null, '담당': r.analysts.join(', ') || '커버리지 외', '발간 상태': r.target === false ? '작성 대상 아님' : r.pub})));
    ws['!cols'] = [{wch: 18}, {wch: 16}, {wch: 18}, {wch: 16}]; const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, '밸류업 현황');
    XLSX.writeFile(wb, `밸류업_현황_${P[S.period]}_${D.today}.xlsx`); return; }
  render(); });
render(); refreshPub();
</script>
</body></html>
