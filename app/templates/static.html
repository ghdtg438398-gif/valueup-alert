<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>밸류업 공시 트래커</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f6f5f2;--panel:#fff;--ink:#1b1d21;--muted:#6b6f78;--line:#e4e2dc;--accent:#c8102e;--accent-soft:#fbe9ec;--ok:#1f7a4d;--ok-soft:#e5f3ec;--info:#1f4f8a;--info-soft:#e6eef9;--pu:#6b3fb5;--pu-soft:#efe6fb}
@media (prefers-color-scheme:dark){:root{--bg:#121316;--panel:#1b1d21;--ink:#ecebe7;--muted:#9a9ca3;--line:#2c2e33;--accent:#ff5a6e;--accent-soft:#3a1d22;--ok:#5fc791;--ok-soft:#173326;--info:#7fb0ef;--info-soft:#18273b;--pu:#b896f0;--pu-soft:#2a2140}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Pretendard,-apple-system,"Malgun Gothic",sans-serif}
header{background:var(--panel);border-bottom:1px solid var(--line)}
.wrap{max-width:1400px;margin:0 auto;padding:0 20px}
.bar{display:flex;align-items:center;height:56px;gap:20px}
.brand{font-weight:800;display:flex;gap:8px;align-items:center}.brand i{width:10px;height:10px;border-radius:2px;background:var(--accent);display:inline-block}
.upd{margin-left:auto;color:var(--muted);font-size:13px}
main{padding:24px 0 60px}
.banner{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap;margin-bottom:18px}
.kpi{flex:0 0 300px;background:linear-gradient(0deg,var(--accent-soft),var(--panel) 70%);border:1px solid var(--accent);border-radius:12px;padding:14px 16px}
.kpi small{color:var(--muted);font-weight:600;font-size:12px}.kpi b{display:block;font-size:26px;margin-top:2px}.kpi span{font-size:12px;color:var(--muted)}
.ctrl{display:flex;gap:10px;align-items:center;margin-left:auto;flex-wrap:wrap}
.tog{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600;cursor:pointer;color:inherit;font-family:inherit}
.sw{width:34px;height:20px;border-radius:99px;background:#c9ccd3;position:relative}.sw:after{content:"";position:absolute;left:3px;top:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:.15s}
.sw.on{background:var(--ok)}.sw.on:after{left:17px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;padding:6px 11px;font:600 12.5px Pretendard,sans-serif;color:var(--muted);cursor:pointer}.seg button.on{background:var(--info-soft);color:var(--info)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:14px 16px;border-bottom:1px solid var(--line);align-items:center}
.chip{border:1px solid var(--line);border-radius:99px;padding:5px 11px;font:600 13px Pretendard,sans-serif;background:var(--panel);color:var(--ink);cursor:pointer}
.chip em{font-style:normal;color:var(--muted);margin-left:4px;font-weight:500}.chip.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}.chip.on em{color:inherit;opacity:.7}
.right{margin-left:auto;display:flex;gap:8px}
.btn{font:600 13px Pretendard,sans-serif;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;padding:6px 12px;cursor:pointer}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}
th{font-size:12px;color:var(--muted);font-weight:600;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.co{white-space:nowrap}.co a{color:inherit;text-decoration:none;font-weight:700}.co small,.cap small{display:block;color:var(--muted);font-size:11.5px}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.t-계획,.t-재공시{background:var(--info-soft);color:var(--info)}.t-이행{background:var(--ok-soft);color:var(--ok)}.t-이행\+계획{background:var(--pu-soft);color:var(--pu)}
.pub-no{background:var(--accent-soft);color:var(--accent)}.pub-yes{background:var(--ok-soft);color:var(--ok)}
.key{font-size:12.5px;max-width:330px}.muted{color:var(--muted)}
tr.out td{color:var(--muted)}tr.out .pill{opacity:.5}
.day td{background:var(--bg);font-size:12px;font-weight:700;color:var(--muted);padding:7px 12px}
.note{padding:10px 16px;font-size:12px;color:var(--muted)}
.ck{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;margin-right:10px;cursor:pointer;white-space:nowrap}
.ck input{width:16px;height:16px;accent-color:var(--ok);margin:0;cursor:pointer}.ck.dim{opacity:.45}
.ck input:disabled{cursor:not-allowed}
.warn{margin:0 0 14px;padding:10px 14px;border-radius:8px;background:var(--accent-soft);color:var(--accent);font-size:13px}
.stbar[hidden]{display:none}
.stbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--bg)}
.sbtn{border:1px solid var(--line);border-radius:8px;padding:4px 10px;font:600 12.5px Pretendard,sans-serif;background:var(--panel);color:var(--ink);cursor:pointer}
.sbtn em{font-style:normal;margin-left:5px;opacity:.7}.sbtn.on{outline:2px solid var(--ink);outline-offset:-1px}
.st-no{background:var(--accent-soft);color:var(--accent)}.st-wait{background:var(--info-soft);color:var(--info)}
.st-todo{background:#fdf3d7;color:#9a6700}.st-done{background:var(--ok-soft);color:var(--ok)}
.st-rej{background:var(--line);color:var(--muted)}.ck.rej{color:var(--muted)}.ck.rej input{accent-color:#6b6f78}
.asg{font-size:12.5px;position:relative;white-space:nowrap}
.tm{font-size:11.5px;color:var(--muted)}.tm.ot{background:var(--line);border-radius:99px;padding:1px 7px;font-weight:700}.tm.unk{background:#fdf3d7;color:#9a6700;border-radius:99px;padding:1px 7px;font-weight:700}.asg small{color:var(--muted)}
.asg select.as{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.asg:hover .who{text-decoration:underline dotted}
.range{display:flex;align-items:center;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:3px 6px}
.range input{border:0;background:none;font:600 12.5px Pretendard,sans-serif;color:var(--ink);width:118px}
.range span{color:var(--muted)}
.pubinfo{display:block;font-size:11px;color:var(--muted);font-weight:500;margin-top:2px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:20}
.modal[hidden]{display:none}
.modal .box{background:var(--panel);border-radius:12px;padding:20px;width:320px;display:grid;gap:10px}
.modal label{font-size:12px;color:var(--muted);font-weight:600;display:grid;gap:4px}
.modal textarea{font:14px Pretendard,sans-serif;padding:7px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);resize:vertical}
.rjnote{display:block;max-width:220px;margin-top:3px;border:1px dashed var(--line);background:none;border-radius:6px;padding:3px 7px;font:500 11.5px Pretendard,sans-serif;color:var(--muted);text-align:left;cursor:pointer;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;white-space:normal;line-height:1.4}
.rjnote:hover{border-color:var(--muted);color:var(--ink)}
.seg.yr{align-items:center}.seg.yr .lbl{font-size:11.5px;color:var(--muted);font-weight:700;padding:0 8px 0 10px}
.range.dim{opacity:.4}
.dfnote{display:block;max-width:260px;margin-top:3px;border:0;background:var(--pu-soft);color:var(--pu);border-radius:6px;padding:2px 7px;font:500 11.5px Pretendard,sans-serif;text-align:left;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tkinfo{display:block;font-size:11px;color:var(--pu);font-weight:600}
.xbtn.dfb{color:var(--pu)}
.tog.sm{padding:6px 10px;font-size:12.5px}
.modal input,.modal select{font:14px Pretendard,sans-serif;padding:7px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink)}
.modal .row{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:9px 16px;border-radius:8px;font-size:13px;opacity:0;transition:.2s;pointer-events:none}
.toast.on{opacity:1}
.xbtn{border:1px solid transparent;background:none;color:var(--muted);border-radius:6px;padding:3px 7px;font:600 12px Pretendard,sans-serif;cursor:pointer;white-space:nowrap}
.xbtn:hover{border-color:var(--line);color:var(--accent)}.xbtn.rs{border-color:var(--line);color:var(--ok)}
.chip.ex{border-style:dashed}.exinfo{color:var(--accent)!important}
.uv{display:inline-block;font-size:11px;font-weight:700;color:#9a6700;background:#fdf3d7;border-radius:99px;padding:1px 7px;white-space:nowrap;cursor:help}
@media (max-width:760px){.hide-m{display:none}.kpi{flex-basis:100%}.ctrl{margin-left:0}}
</style></head>
<body>
<header><div class="wrap bar"><div class="brand"><i></i>밸류업 공시 트래커</div><div class="upd" id="upd"></div><button class="btn" id="auth" style="font-size:12px"></button></div></header>
<main><div class="wrap">
  <div class="warn" id="caperr" hidden></div>
  <div class="banner">
    <div class="kpi" id="kpi"></div>
    <div class="ctrl">
      <button class="tog" id="tog"><span class="sw on" id="sw"></span>작성 대상만 <span class="muted" style="font-weight:500" id="range"></span></button>
      <div class="seg yr" id="years" title="그 해에 써야 하는 보고서 (공시 연도 기준, 이월하면 다음 해로)"></div>
      <div class="seg" id="periods"></div>
      <div class="range"><input type="date" id="dfrom"><span>~</span><input type="date" id="dto"></div>
    </div>
  </div>
  <div class="card">
    <div class="chips"><span id="chips" style="display:contents"></span>
      <div class="right"><button class="tog sm" id="hidedone" hidden><span class="sw" id="hdsw"></span>발간 완료 숨기기</button><div class="seg" id="types"></div><button class="btn" id="addold" title="1년보다 오래된 공시를 회사 단위로 불러오기">＋ 과거 공시</button><button class="btn" id="xls">⬇ 엑셀</button></div></div>
    <div class="stbar" id="stbar"></div>
    <div class="tw"><table>
      <thead><tr><th>시각</th><th>종목</th><th>공시 구분</th><th class="num">발표일 시총</th><th class="num hide-m">종가</th><th class="hide-m">핵심</th><th>담당</th><th>발간 체크</th><th>상태</th><th></th></tr></thead>
      <tbody id="tb"></tbody></table></div>
    <div class="note" id="addnote" hidden></div>
    <div class="note">발간 체크·담당(이름 클릭)은 종목 단위로 바로 저장되어 팀 전체에 공유됩니다 (처음 한 번 <b>수정 권한 연결</b> 필요) · 발표일 시총 = 공시일 종가 × 상장주식수 · PDF·한글·워드 첨부 확인된 공시만 (⚠ 첨부 미확인 = 접속 문제로 아직 확인 못 함) · 이상한 공시는 맨 오른쪽 ✕로 제외, <b>제외됨</b>에서 복원</div>
  </div>
</div></main><div class="toast" id="toast"></div>
<div class="modal" id="pubmodal" hidden><div class="box">
  <b id="pm-title"></b>
  <label>발간일<input type="date" id="pm-date"></label>
  <label>발간인<input id="pm-by" list="pm-names" placeholder="이름"><datalist id="pm-names"></datalist></label>
  <div class="row"><button class="btn" id="pm-cancel">취소</button><button class="btn" id="pm-ok" style="background:var(--ink);color:var(--panel)">저장</button></div>
</div></div>
<div class="modal" id="defmodal" hidden><div class="box">
  <b id="df-title"></b>
  <span class="muted" id="df-sub" style="font-size:12px"></span>
  <label>작성 연도 변경<select id="df-year"></select></label>
  <label>이월 사유<textarea id="df-reason" rows="4" placeholder="예: 12월 계획 공시라 연내 작성 불가, 2027년 1분기 작성 예정"></textarea></label>
  <label>작성자<input id="df-by" list="pm-names" placeholder="이름"></label>
  <div class="row"><button class="btn" id="df-off" style="margin-right:auto;color:var(--accent)" hidden>이월 취소</button><button class="btn" id="df-cancel">닫기</button><button class="btn" id="df-ok" style="background:var(--ink);color:var(--panel)">저장</button></div>
</div></div>
<div class="modal" id="rejmodal" hidden><div class="box">
  <b id="rj-title"></b>
  <label>거절 구분<select id="rj-stage"><option value="plan">계획 발간 거절</option><option value="impl">이행 발간 거절</option></select></label>
  <label>사유<textarea id="rj-reason" rows="4" placeholder="예: 계획 발간은 완료, 이행은 회사 일정상 미팅 불가로 거절"></textarea></label>
  <label>날짜<input type="date" id="rj-date"></label>
  <label>작성자<input id="rj-by" list="pm-names" placeholder="이름"></label>
  <div class="row"><button class="btn" id="rj-off" style="margin-right:auto;color:var(--accent)" hidden>거절 취소</button><button class="btn" id="rj-cancel">닫기</button><button class="btn" id="rj-ok" style="background:var(--ink);color:var(--panel)">저장</button></div>
</div></div>
<script>
let D = {{ data_json|safe }};
const S = {period: 'today', from: '', to: '', analyst: '', type: '', target: true, status: '', hideDone: false, year: ''};
const P = {today: '오늘', week: '이번 주', month: '최근 30일', year: '1년', all: '전체'};
const ST = ['미발간', '이행 미공시', '이행 미발간', '발간 완료', '발간 거절'];
const STC = {'미발간': 'st-no', '이행 미공시': 'st-wait', '이행 미발간': 'st-todo', '발간 완료': 'st-done', '발간 거절': 'st-rej'};
const W = '일월화수목금토';
const ymd = d => d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0');
const td = new Date(+D.today.slice(0,4), +D.today.slice(4,6) - 1, +D.today.slice(6));
function since(p) { const d = new Date(td); if (p === 'week') d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
  if (p === 'month') d.setDate(d.getDate() - 30); if (p === 'year') d.setDate(d.getDate() - 365); if (p === 'all') return '00000000'; return ymd(d); }
function setPeriod(p) { S.period = p; S.from = p === 'all' ? '' : since(p); S.to = D.today; }
const iso = s => s ? `${s.slice(0,4)}-${s.slice(4,6)}-${s.slice(6)}` : '';
const dots = s => s ? `${s.slice(0,4)}.${s.slice(4,6)}.${s.slice(6)}` : '';
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ---- 공유 상태(발간 체크·담당): GitHub 저장소의 data/pub_status.json ----
const LS = k => { try { return localStorage.getItem(k) } catch (e) { return null } };
const LSset = (k, v) => { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k) } catch (e) {} };
let T = LS('vu_token'); let REPO = LS('vu_repo') || D.repo; let WHO = LS('vu_who') || '';
let STATE = norm(D.state);
const FILE = 'data/pub_status.json';
function norm(x) { x = x || {}; return {pub: x.pub || {}, assign: x.assign || {}, exclude: x.exclude || {}, defer: x.defer || {}, add: x.add || {}}; }
const isEx = r => !!STATE.exclude[r.id];
const gh = (path, opt = {}) => fetch(`https://api.github.com/repos/${REPO}/contents/${path}`, {...opt,
  headers: {'Authorization': 'Bearer ' + T, 'Accept': 'application/vnd.github+json', ...(opt.headers || {})}});
const b64d = b => new TextDecoder().decode(Uint8Array.from(atob(b.replace(/\n/g, '')), c => c.charCodeAt(0)));
const b64e = s => btoa(String.fromCharCode(...new TextEncoder().encode(s)));
function toast(m) { const t = document.getElementById('toast'); t.textContent = m; t.classList.add('on'); setTimeout(() => t.classList.remove('on'), 2200); }
async function readState() { const r = await gh(FILE + '?ref=' + D.branch + '&t=' + Date.now());
  if (r.status === 404) return {data: norm({}), sha: null}; if (!r.ok) throw new Error(r.status);
  const j = await r.json(); let d = {}; try { d = JSON.parse(b64d(j.content) || '{}'); } catch (e) {}
  return {data: norm(d), sha: j.sha}; }
async function saveState(mutate, msg) {
  for (let k = 0; k < 3; k++) {
    const {data, sha} = await readState(); mutate(data);
    const r = await gh(FILE, {method: 'PUT', body: JSON.stringify({message: msg + ` (${WHO || '-'})`,
      content: b64e(JSON.stringify(data, null, 1)), branch: D.branch, ...(sha ? {sha} : {})})});
    if (r.ok) { STATE = data; return; }
    if (r.status === 401 || r.status === 403) throw new Error('권한 없음 — 토큰 권한(Contents: Read and write) 확인');
    if (r.status !== 409 && r.status !== 422) throw new Error(r.status);
  }
  throw new Error('동시에 수정 중 — 다시 시도해 주세요');
}
const now = () => new Date().toLocaleString('sv-SE').slice(0, 19);
async function connect() {
  if (T) { if (confirm('연결을 해제할까요?')) { LSset('vu_token'); T = null; render(); } return false; }
  const t = prompt('수정하려면 GitHub 토큰이 필요해요. 토큰을 붙여넣으세요\n(Fine-grained token · 이 저장소 · Contents: Read and write)'); if (!t) return false;
  const repo = D.repo || prompt('저장소 이름 (예: 아이디/valueup-alert)'); if (!repo) return false;
  const who = prompt('이름 (수정 기록용)', WHO) || '';
  T = t.trim(); REPO = repo.trim(); WHO = who.trim();
  try { await readState(); } catch (e) { alert('연결 실패 (' + e.message + ')\n토큰 권한과 저장소 이름을 확인하세요.'); T = null; return false; }
  LSset('vu_token', T); LSset('vu_repo', REPO); LSset('vu_who', WHO); toast('연결됐어요. 이제 수정할 수 있어요'); await refresh(); return true;
}
async function refresh() {  // 내려받은 파일이 오래돼도 저장소의 최신 데이터·상태로 갱신
  if (!T) {   // 토큰 없이: 공개 저장소면 최신 체크 상태를 바로 읽음 (비공개면 조용히 건너뜀)
    if (!REPO) return;
    try { const r = await fetch(`https://raw.githubusercontent.com/${REPO}/${D.branch}/data/pub_status.json?t=${Date.now()}`);
      if (r.ok) { STATE = norm(await r.json()); render(); } } catch (e) {}
    return;
  }
  try {
    const r = await gh('docs/data.json?ref=' + D.branch + '&t=' + Date.now(), {headers: {'Accept': 'application/vnd.github.raw+json'}});
    if (r.ok) { const nd = await r.json(); if ((nd.lastUpdate || '') >= (D.lastUpdate || '')) D = nd; }
    STATE = (await readState()).data; render();
  } catch (e) { toast('최신 상태를 못 불러왔어요 (' + e.message + ')'); }
}

// ---- 발간일·발간인 입력 ----
function askPub(name, f, code) {
  return new Promise(res => {
    const m = document.getElementById('pubmodal');
    document.getElementById('pm-title').textContent = `${name} · ${f === 'plan' ? '계획' : '이행'} 발간`;
    document.getElementById('pm-date').value = new Date().toLocaleDateString('sv-SE');

      <td class="num cap">${r.cap ? `<b>${r.capTxt}</b><small title="${esc(r.capSrc)} · 상장주식수 ${r.shares ? r.shares.toLocaleString() + '주' : '-'}">${r.target === false ? '대상 외' : r.capDt + ' 종가' + (r.final ? '' : ' · ' + (r.capSrc.startsWith('한투') ? '잠정' : '추정'))}</small>` : '<span class="muted">확인 중</span>'}</td>
      <td class="num hide-m">${r.close ? r.close.toLocaleString() : '-'}</td>
      <td class="key hide-m">${esc(r.key)}</td>
      <td class="asg">${assignCell(r)}</td>
      <td>${out ? `<span class="muted" style="font-size:12px">${ex ? '제외됨' : ot ? '다른 팀 종목' : '작성 대상 아님'}</span>` :
        ['plan', 'impl'].map(f => `<label class="ck" style="vertical-align:top"><input type="checkbox" data-code="${esc(r.code)}" data-name="${esc(r.name)}" data-f="${f}" ${p[f] ? 'checked' : ''}>${f === 'plan' ? '계획' : '이행'} 발간`
          + (p[f] && (p[f + '_date'] || p[f + '_by']) ? `<small class="pubinfo">${esc((p[f + '_date'] || '').slice(2).replace(/-/g, '.'))} ${esc(p[f + '_by'] || '')}</small>` : '') + `</label>`).join('')
      + `<label class="ck rej" style="vertical-align:top"><input type="checkbox" data-code="${esc(r.code)}" data-name="${esc(r.name)}" data-f="reject" ${p.reject ? 'checked' : ''}>발간 거절`
      + (p.reject ? `<small class="pubinfo">${esc(rejLabel(p))} ${esc((p.reject_date || '').slice(2).replace(/-/g, '.'))} ${esc(p.reject_by || '')}</small>` : '') + `</label>`
      + (p.reject ? `<button class="rjnote" data-rj="${esc(r.code)}" data-name="${esc(r.name)}" title="${esc(p.reject_reason || '사유 없음 — 눌러서 적기')}">${p.reject_reason ? '💬 ' + esc(p.reject_reason) : '＋ 사유 적기'}</button>` : '')}</td>
      <td>${out ? '' : `<span class="pill ${STC[st]}" ${p.reject ? `title="${esc(rejLabel(p) + ' · ' + (p.reject_reason || ''))}"` : ''}>${st}</span>`}</td>
      <td style="white-space:nowrap">${tk && !out && tk.stage !== 'done' ? `<button class="xbtn dfb" data-df="${esc(tk.key)}" data-name="${esc(r.name)}" title="이 보고서를 다음 해로 이월 (사유 필수)">↷</button>` : ''}${ex ? `<button class="xbtn rs" data-r="${esc(r.id)}" data-name="${esc(r.name)}">↩ 복원</button>`
        : `<button class="xbtn" data-x="${esc(r.id)}" data-name="${esc(r.name)}" title="이 공시를 작성 대상에서 제외 (언제든 복원 가능)">✕</button>`}</td></tr>`;
  }
  document.getElementById('tb').innerHTML = h || `<tr><td colspan="10" class="muted" style="text-align:center;padding:40px">${S.year ? S.year + '년에 작성할 보고서 중' : (dots(S.from) || '처음') + ' ~ ' + dots(S.to) + ' 기간에'} 조건에 맞는 공시가 없습니다.</td></tr>`;
}
document.addEventListener('change', async e => {
  const el = e.target;
  if (el.id === 'dfrom' || el.id === 'dto') {
    const v = el.value.replace(/-/g, ''); if (el.id === 'dfrom') S.from = v; else S.to = v || D.today;
    S.period = 'custom'; S.year = ''; render(); return;
  }
  if (el.matches('input[data-f]')) {
    const val = el.checked; el.checked = !val;          // 저장 성공 후 반영
    if (!T && !(await connect())) return;
    const f = el.dataset.f; let info = null;
    if (f === 'reject') { await editReject(el.dataset.code, el.dataset.name); return; }   // 거절은 사유 입력창으로
    if (val) { info = await askPub(el.dataset.name, f, el.dataset.code); if (!info) return; }
    el.disabled = true;
    try {
      await saveState(d => { const c = d.pub[el.dataset.code] || {plan: false, impl: false};
        c[f] = val; c.by = WHO; c.at = now();
        if (f !== 'reject') { if (val) { c[f + '_date'] = info.date; c[f + '_by'] = info.by; } else { delete c[f + '_date']; delete c[f + '_by']; } }
        d.pub[el.dataset.code] = c; },
        `발간 체크: ${el.dataset.name} ${({plan: '계획', impl: '이행', reject: '거절'})[el.dataset.f]}=${val ? 'O' : 'X'}`);
      toast(`${el.dataset.name}: ${statusOf(el.dataset.code)}`);
    } catch (err) { alert('저장 실패: ' + err.message); }
    render();
  } else if (el.matches('select.as')) {
    const v = el.value;
    if (!T && !(await connect())) { render(); return; }
    try {
      await saveState(d => { if (v) d.assign[el.dataset.code] = {analyst: v, by: WHO, at: now()}; else delete d.assign[el.dataset.code]; },
        `담당 변경: ${el.dataset.name} → ${v === '-' ? '커버리지 외' : v || '엑셀 기준'}`);
      toast('담당을 바꿨어요');
    } catch (err) { alert('저장 실패: ' + err.message); }
    render();
  }
});
async function setExclude(el, on) {
  if (!T && !(await connect())) return;
  let reason = '';
  if (on) { reason = prompt(`${el.dataset.name} 공시를 작성 대상에서 제외할까요?\n(목록·건수·엑셀·텔레그램에서 빠지고, '제외됨'에서 언제든 복원)\n\n사유 (선택):`, ''); if (reason === null) return; }
  el.disabled = true;
  try {
    await saveState(d => { if (on) d.exclude[el.dataset.x] = {name: el.dataset.name, by: WHO, at: now(), reason: reason.trim()}; else delete d.exclude[el.dataset.r]; },
      `${on ? '공시 제외' : '제외 복원'}: ${el.dataset.name}`);
    toast(on ? `${el.dataset.name}: 제외했어요 (제외됨에서 복원 가능)` : `${el.dataset.name}: 복원했어요`);
    if (!on && !exRows().length && S.analyst === '__excl__') S.analyst = '';
  } catch (err) { alert('저장 실패: ' + err.message); }
  render();
}
document.addEventListener('click', e => { const el = e.target.closest('button'); if (!el) return;
  if (el.id === 'auth') { connect(); return; }
  if (el.id === 'addold') { addOld(); return; }
  if (el.dataset.x) { setExclude(el, true); return; }
  if (el.dataset.r) { setExclude(el, false); return; }
  if (/^(pm|rj|df)-/.test(el.id)) return;
  if (el.id === 'hidedone') { S.hideDone = !S.hideDone; LSset('vu_hidedone', S.hideDone ? '1' : ''); }
  else if (el.dataset.rj) { editReject(el.dataset.rj, el.dataset.name); return; }
  else if (el.dataset.df) { editDefer(el.dataset.df, el.dataset.name); return; }
  else if (el.dataset.y) { const y = +el.dataset.y; S.year = S.year === y ? '' : y; S.status = '';
    if (S.analyst === '__defer__' && !S.year) S.analyst = ''; }
  else if (el.id === 'tog') S.target = !S.target; else if (el.dataset.p) { S.year = ''; if (S.analyst === '__defer__') S.analyst = ''; setPeriod(el.dataset.p); }
  else if (el.dataset.s !== undefined) S.status = el.dataset.s;
  else if (el.dataset.t !== undefined) S.type = el.dataset.t;
  else if (el.dataset.a !== undefined) { S.analyst = el.dataset.a; if (S.analyst) S.status = ''; }
  else if (el.id === 'xls') { const ws = XLSX.utils.json_to_sheet(view().map(r => { const p = STATE.pub[r.code] || {}; return {
      '공시일': dots(r.dt), '종목명': r.name, '공시 구분': r.type,
      '발표일 시총(억원)': r.cap ? Math.round(r.cap / 1e8) : null, '담당': analystsOf(r).join(', ') || (other(r) ? shortTeam(r.team) + ' 종목' : r.team ? '커버리지 외(' + shortTeam(MY) + ')' : '미분류'),
      '발간 상태': other(r) ? '다른 팀 종목' : isEx(r) ? '제외' + (STATE.exclude[r.id].reason ? ' (' + STATE.exclude[r.id].reason + ')' : '') : r.target === false ? '작성 대상 아님' : statusOf(r.code),
      '계획 발간일': p.plan ? (p.plan_date || '') : '', '계획 발간인': p.plan ? (p.plan_by || '') : '',
      '이행 발간일': p.impl ? (p.impl_date || '') : '', '이행 발간인': p.impl ? (p.impl_by || '') : '',
      ...(S.year ? (t => ({'작성 연도': t ? t.year : '', '작성할 보고서': t ? ({plan: '계획', impl: '이행', done: '완료'})[t.stage] : '', '이월 사유': t && t.defer ? t.defer.reason : ''}))(taskOf(r)) : {}),
      '거절 구분': rejLabel(p), '거절 사유': p.reject ? (p.reject_reason || '') : '', '거절일': p.reject ? (p.reject_date || '') : '', '거절 작성자': p.reject ? (p.reject_by || '') : ''}; }));
    ws['!cols'] = [{wch: 11}, {wch: 18}, {wch: 9}, {wch: 15}, {wch: 14}, {wch: 13}, {wch: 11}, {wch: 10}, {wch: 11}, {wch: 10}, {wch: 9}, {wch: 30}, {wch: 10}, {wch: 9}, {wch: 40}, {wch: 11}, {wch: 10}]; const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, '밸류업 현황');
    XLSX.writeFile(wb, S.year ? `밸류업_${S.year}년_작성대상.xlsx` : `밸류업_현황_${S.from || '전체'}-${S.to}.xlsx`); return; }
  render(); });
S.hideDone = LS('vu_hidedone') === '1';
setPeriod('today'); render(); refresh();
</script>
</body></html>
