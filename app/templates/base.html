<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}밸류업 공시 트래커{% endblock %}</title>
{% block head %}{% endblock %}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --bg:#f6f5f2; --panel:#fff; --ink:#1b1d21; --muted:#6b6f78; --line:#e4e2dc;
  --accent:#c8102e; --accent-soft:#fbe9ec; --ok:#1f7a4d; --ok-soft:#e5f3ec;
  --warn:#9a6700; --warn-soft:#fdf3d7; --info:#1f4f8a; --info-soft:#e6eef9;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#121316; --panel:#1b1d21; --ink:#ecebe7; --muted:#9a9ca3; --line:#2c2e33;
    --accent:#ff5a6e; --accent-soft:#3a1d22; --ok:#5fc791; --ok-soft:#173326;
    --warn:#e3b341; --warn-soft:#3a2f12; --info:#7fb0ef; --info-soft:#18273b;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
a{color:inherit}
header{background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.wrap{max-width:1400px;margin:0 auto;padding:0 20px}
.bar{display:flex;align-items:center;gap:24px;height:56px}
.brand{font-weight:800;letter-spacing:-.02em;font-size:16px;text-decoration:none;display:flex;align-items:center;gap:8px}
.brand i{display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--accent)}
nav a{color:var(--muted);text-decoration:none;margin-right:16px;font-weight:600}
nav a.on,nav a:hover{color:var(--ink)}
.me{margin-left:auto;display:flex;gap:6px;align-items:center;color:var(--muted)}
main{padding:24px 0 60px}
h1{font-size:22px;letter-spacing:-.03em;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px}
select,input[type=text],input[type=number],textarea{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
button,.btn{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;padding:6px 12px;cursor:pointer;text-decoration:none;display:inline-block}
.btn.primary,button.primary{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.p-미착수{background:var(--accent-soft);color:var(--accent)}
.p-작성중{background:var(--warn-soft);color:var(--warn)}
.p-완료{background:var(--ok-soft);color:var(--ok)}
.p-제외{background:var(--line);color:var(--muted)}
.tag{background:var(--info-soft);color:var(--info)}
.t-계획{background:var(--info-soft);color:var(--info)}
.t-이행{background:var(--ok-soft);color:var(--ok)}
.t-이행\+계획{background:#efe6fb;color:#6b3fb5}
.t-재공시{background:var(--line);color:var(--muted)}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.muted{color:var(--muted)}
.mono{font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse}
th{font-size:12px;color:var(--muted);font-weight:600;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.mine td{background:color-mix(in srgb,var(--accent-soft) 45%,transparent)}
.flash{padding:10px 14px;border-radius:8px;background:var(--info-soft);color:var(--info);margin-bottom:16px}
@media (max-width:760px){
  .hide-m{display:none}
  .bar{gap:12px} nav a{margin-right:10px}
  td,th{padding:8px 6px}
}
</style>
</head>
<body>
<header><div class="wrap bar">
  <a class="brand" href="/"><i></i>밸류업 공시 트래커</a>
  <nav>
    <a href="/" class="{% if request.url.path == '/' %}on{% endif %}">공시</a>
    <a href="/coverage" class="{% if request.url.path.startswith('/coverage') %}on{% endif %}">커버리지</a>
    <a href="/digest" class="{% if request.url.path.startswith('/digest') %}on{% endif %}">리포트</a>
  </nav>
  <div class="me hide-m">{% if last_update %}마지막 업데이트 {{ last_update[5:16].replace('-', '/') }}{% endif %}</div>
</div></header>
<main><div class="wrap">
{% block content %}{% endblock %}
</div></main>
</body>
</html>
